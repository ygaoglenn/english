<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glenn's Daily English</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f2a4a">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://www.youtube.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#14202f;--soft:#5d6577;--line:#e3e0d8;--paper:#f6f3ec;--card:#fff;--navy:#0f2a4a;--red:#c4302b;--gold:#d39b2a;--green:#2f7a4f;--tint:#eef2f8}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 Inter,system-ui,sans-serif}
a{color:var(--navy)}
.top{background:linear-gradient(120deg,#0b1f38,#16365f 60%,#1d4a7a);color:#fff}
.top .in{max-width:1080px;margin:0 auto;padding:16px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
h1{font-family:Fraunces,Georgia,serif;font-size:24px;line-height:1.15;margin:0}
.date{opacity:.8;font-size:13px}
.streak{display:flex;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap}
.streak b{font-family:Fraunces,serif;font-size:24px;color:var(--gold)}
.dots{display:flex;gap:4px}
.dots i{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.2);display:block}
.dots i.on{background:var(--gold)}
.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:5px 11px;cursor:pointer;font:600 12.5px Inter,sans-serif;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.light{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.gem{background:#fff;color:#3b5bdb;border-color:#c5d0f5}
.wrap{max-width:1080px;margin:0 auto;padding:16px 20px 50px}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cat{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font:600 13px Inter;cursor:pointer;color:var(--ink)}
.cat.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 11px;font:500 12.5px Inter;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.player{display:grid;grid-template-columns:minmax(0,640px) 1fr;gap:16px}
@media (max-width:860px){.player{grid-template-columns:1fr}}
.frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#0b1220}
.frame iframe,.frame>div{position:absolute;inset:0;width:100%;height:100%;border:0}
.side{display:flex;flex-direction:column;gap:9px;font-size:13.5px}
.side h3{font-family:Fraunces,serif;font-size:18px;margin:0}
.pill{display:inline-block;font-size:11.5px;border:1px solid var(--line);border-radius:99px;padding:0 8px;margin:0 3px 3px 0;color:var(--soft)}
.how{background:var(--tint);border-radius:10px;padding:8px 12px}
.how ol{margin:2px 0 0;padding-left:18px}
.gembox{border:1px solid #dbe3fb;background:#f5f7ff;border-radius:10px;padding:8px 12px}
.gembox .row{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.note{font-size:12px;color:var(--soft)}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.lk{display:block;border:1px solid var(--line);border-radius:10px;padding:8px 11px;text-decoration:none;color:var(--ink);font-size:12.5px}
.lk:hover{background:var(--tint)}
.lk b{display:block;font-size:13.5px}
.lk span{color:var(--soft)}
h2{font-family:Fraunces,serif;font-size:17px;margin:0 0 10px}
.mon input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font:13px Inter}
.mon .saved{display:flex;flex-direction:column;gap:4px;max-height:150px;overflow:auto}
.mon .saved div{display:flex;gap:6px;align-items:center}
.mon .saved a{flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.mon .saved button{border:0;background:none;color:var(--soft);cursor:pointer}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:7px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
footer{color:var(--soft);font-size:11.5px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div><h1 id="hello">Good morning, Glenn</h1><div class="date" id="today"></div></div>
  <div class="streak">
    <div class="dots" id="dots" title="最近 7 天"></div>
    连续 <b id="streak">0</b> 天
    <button class="btn light" id="donebtn">今天学完了 ✓</button>
  </div>
</div></div>

<div class="wrap">
  <p class="note" style="margin:0 0 10px">每天选 1–2 个就够了。播放器用的是你的 YouTube 账号（Premium 没有广告）。</p>
  <div class="cats" id="cats"></div>
  <section class="sec" id="main"></section>

  <section class="sec">
    <h2>网站资源 · 有文字稿和练习</h2>
    <div class="links" id="links"></div>
  </section>

  <footer>Real voices only — BBC, British Council and other real speakers, lecturers and engineers</footer>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const $ = id => document.getElementById(id);
const store = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now = new Date();
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY = ymd(now);
const DAY = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 86400000);
$('today').textContent = now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const hr = now.getHours();
$('hello').textContent = (hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening') + ', Glenn';
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}

/* Each channel's long-video uploads playlist: UC... -> UULF... (newest first, no Shorts). */
const uploads = id => 'UULF' + id.slice(2);
const chURL = id => 'https://www.youtube.com/channel/' + id + '/videos';

const CATS = [
 {k:'talk', n:'日常对话', how:['先不看字幕听 5 分钟，猜大意','开英文字幕再听','挑 3 句话，暂停跟读'], list:[
  {n:'Easy English', id:'UCvgLaFuTGGRXl0eyvBRCifA', acc:'英式', zh:'伦敦街头随机采访路人，聊生活话题。和 Word on the Street 风格最像。'},
  {n:"Luke's English Podcast", id:'UC2L7vR43LKuBXXV2AentEMw', acc:'英式', zh:'英国老师 Luke 的长播客，常常是两个人聊 1 小时以上，适合一直放着听。'},
  {n:'BBC Learning English', id:'UCHaHD477h-FeBbVh9Sh7syA', acc:'英式', zh:'6 Minute English、The English We Speak 等。也有 1 小时的合集，适合长时间听。'},
  {n:'English Like a Native', id:'UC0Hg2Ks00kCekyjZG_LxOmg', acc:'英式', zh:'英国老师 Anna，讲英国日常说法和发音，语速慢、清楚。'},
  {n:'Bob the Canadian', id:'UCZJJTxA36ZPNTJ1WFIByaeA', acc:'加拿大', zh:'加拿大老师边散步边聊天，生活英语，语速很慢。'}
 ]},
 {k:'civil', n:'土木 · 智能建造', how:['开英文字幕看','记下 3 个专业词，下次上课可以用','注意他怎么开场、怎么解释一张图'], list:[
  {n:'Rami Tamimi (Surveying)', id:'UC5eVO8WbTV3FU3-AbtRnl9g', acc:'美式', zh:'专业测量工程师，正在读大地测量博士。讲测量、GNSS、全站仪，和你直接相关。'},
  {n:'Practical Engineering', id:'UCMOqf8ab-42UUQIdVoKwjlQ', acc:'美式', zh:'土木工程师 Grady 讲水坝、桥梁、道路、地基，讲得很清楚。上课可以直接参考。'},
  {n:'The B1M', id:'UC6n8I1UDTKP1IWjQMg6_TwA', acc:'英式', zh:'英国频道，讲全球大型建筑、桥梁、城市项目。'},
  {n:'The Efficient Engineer', id:'UCXAS_Ekkq0iFJ9dSUIkcAkw', acc:'英式', zh:'动画讲结构力学、材料、流体。适合学怎么用英语讲基本概念。'},
  {n:'Engineering with Rosie', id:'UClu8Q445-ZAG1dzzP1mHiAw', acc:'英式', zh:'英国工程师 Rosie，讲能源、气候和工程，语速适中。'},
  {n:'BIMvoice', id:'UCPKI_VFw_UHYwEB3WeP69Sw', acc:'各种口音', zh:'BIM 和数字建造的讲座与访谈。'}
 ]},
 {k:'news', n:'新闻', how:['看一条新闻','暂停，用一句英语说：发生了什么？','记下 2 个新词'], list:[
  {n:'BBC News', id:'UC16niRr50-MSBwiO3YDb3RA', acc:'英式', zh:'英国广播公司新闻，2–5 分钟一条。'},
  {n:'Sky News', id:'UCoMdktPbSTixAyNGwb-UYkQ', acc:'英式', zh:'英国天空新闻，现场报道多。'},
  {n:'CNA', id:'UC83jt4dlz1Gjl58fzQrrKZg', acc:'新加坡英语', zh:'新加坡亚洲新闻台，东南亚和马来西亚新闻。'}
 ]},
 {k:'know', n:'科学 · 经济', how:['开英文字幕看','记下 3 个新词','看完用 1 分钟、用英语讲给自己听'], list:[
  {n:'The Economist', id:'UC0p5jTq6Xx_DosDFxVXnWaQ', acc:'英式', zh:'经济、科技、国际形势，讲解清楚。'},
  {n:'Financial Times', id:'UCoUxsWakJucWg46KW5RsvPw', acc:'英式', zh:'英国《金融时报》，经济和商业。'},
  {n:'BBC Earth', id:'UCwmZiChSryoWQCZMIQezgTg', acc:'英式', zh:'自然纪录片，英式旁白最好听。'},
  {n:'Kurzgesagt', id:'UCsXVk37bltHxD1rDPwtNM8Q', acc:'清楚的标准英语', zh:'动画讲科学大问题，10 分钟左右。'},
  {n:'Veritasium', id:'UCHnyfMqiRRG1u-2MsSQLbXA', acc:'澳式', zh:'物理和工程的有趣实验，讲得很生动。'},
  {n:'TED-Ed', id:'UCsooa4yRKGN_zEE8iknghZA', acc:'各种口音', zh:'5 分钟动画知识课，话题很广。'}
 ]},
 {k:'lect', n:'讲课', how:['看开头 10 分钟：他怎么开场？','记下 2 个好用的讲课句子','这周上课试用一次'], list:[
  {n:'Royal Institution', id:'UCYeF244yNGuFefuFKqxIAXw', acc:'英式', zh:'英国皇家研究院科学讲座。学怎么把难的东西讲简单。'},
  {n:'Gresham College', id:'UC1t6kKXoBvjdr8m9KJ2Fx7A', acc:'英式', zh:'伦敦免费公开讲座，1 小时左右，工程、AI、经济都有。'},
  {n:'MIT OpenCourseWare', id:'UCEBb1b_L6zDS3xTUrIALZOw', acc:'美式', zh:'MIT 真实课堂录像，看教授怎么上课、怎么回答学生。'},
  {n:'Stanford Online', id:'UCBa5G_ESCn8Yd4vw5U-gIcg', acc:'美式', zh:'斯坦福公开课和讲座，很多 AI 课程。'},
  {n:'TED', id:'UCAuUUnT6oDeKwE6v1NGQxug', acc:'各种口音', zh:'18 分钟演讲，学怎么讲故事、怎么开场。'}
 ]},
 {k:'monash', n:'Monash 讲课视频', monash:true}
];

const LINKS = [
 {t:'Word on the Street', s:'British Council · 有文字稿和练习', u:'https://learnenglish.britishcouncil.org/free-resources/general/video-series/word-street'},
 {t:'6 Minute English', s:'BBC Learning English · 文字稿', u:'https://www.bbc.co.uk/learningenglish/english/features/6-minute-english'},
 {t:'Business English', s:'British Council · 开会、邮件、演讲', u:'https://learnenglish.britishcouncil.org/business-english'},
 {t:'BBC Sounds podcasts', s:'In Our Time · The Life Scientific', u:'https://www.bbc.co.uk/sounds/brand/b006qykl'}
];

/* ---------- YouTube player (IFrame API, so we can get the current video link) ---------- */
let player = null, apiReady = false, pending = null;
window.onYouTubeIframeAPIReady = () => { apiReady = true; if (pending) { const p = pending; pending = null; play(p); } };
function play(ch){
  if (!apiReady) { pending = ch; return; }
  const list = uploads(ch.id);
  if (player && player.loadPlaylist && document.getElementById('yt')) { player.cuePlaylist({listType:'playlist', list}); return; }
  player = new YT.Player('yt', {
    host: 'https://www.youtube.com',
    playerVars: {listType:'playlist', list, cc_load_policy:1, cc_lang_pref:'en', hl:'en-GB', rel:0, playsinline:1}
  });
}
function currentVideo(){
  try { const u = player.getVideoUrl(); const t = (player.getVideoData()||{}).title || ''; if (u && /v=/.test(u)) return {u, t}; } catch(e){}
  return null;
}

/* ---------- Gemini helper ---------- */
const GEM = [
 {n:'中英对照总结', p:v=>`Please watch this YouTube video: ${v.u}\nTitle: ${v.t}\nI am a Chinese university lecturer learning English. Give me: 1) a short summary in simple English, 2) the same summary in Chinese, 3) 8 useful words or phrases from the video with Chinese meaning and an example sentence.`},
 {n:'口语练习', p:v=>`Please watch this YouTube video: ${v.u}\nTitle: ${v.t}\nAct as my English speaking partner. Ask me 5 questions about this video, one at a time. After each answer, correct my English gently and show a more natural British way to say it.`},
 {n:'讲课句子', p:v=>`Please watch this YouTube video: ${v.u}\nTitle: ${v.t}\nPick 8 sentences the speaker uses to explain, give examples, or move to the next point. For each, give the Chinese meaning and show how I could use it when teaching civil engineering.`}
];
async function askGemini(i){
  const v = currentVideo();
  if (!v) { toast('先点播放，再点这个按钮'); return; }
  const text = GEM[i].p(v);
  try { await navigator.clipboard.writeText(text); toast('已复制，在 Gemini 里按 Ctrl+V'); } catch(e) { prompt('复制下面的文字，粘贴到 Gemini：', text); }
  window.open('https://gemini.google.com/app', '_blank', 'noopener');
}

/* ---------- Monash (Panopto / Echo360) ---------- */
const PANOPTO = 'https://monash.au.panopto.com';
function panoptoEmbed(url){
  const m = String(url).match(/[?&]id=([0-9a-f-]{36})/i);
  return m ? PANOPTO + '/Panopto/Pages/Embed.aspx?id=' + m[1] + '&autoplay=false&offerviewer=true&showtitle=true&interactivity=all' : null;
}
function monashView(){
  const saved = store.get('eh_monash', []);
  return `<div class="player mon">
    <div class="frame" id="monFrame"><div style="display:flex;align-items:center;justify-content:center;color:#cfd6e4;padding:20px;text-align:center;font-size:13px">在右边粘贴一个 Panopto 视频链接，就会在这里播放。</div></div>
    <div class="side">
      <h3>Monash 讲课视频</h3>
      <p style="margin:0">先打开平台，用 Monash 账号登录（Monash Okta），选一个你想听的课。复制视频链接，粘贴到下面，就能在这里播放。</p>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <a class="btn" href="${PANOPTO}/Panopto/Pages/Home.aspx" target="_blank" rel="noopener">打开 Panopto ↗</a>
        <a class="btn ghost" href="https://echo360.org.au" target="_blank" rel="noopener">打开 Echo360 ↗</a>
      </div>
      <input id="monUrl" placeholder="粘贴 Panopto 视频链接（Viewer.aspx?id=…）">
      <div style="display:flex;gap:6px"><button class="btn" id="monPlay">在这里播放</button><button class="btn ghost" id="monSave">保存到列表</button></div>
      <div class="saved" id="monSaved">${saved.map((s,i)=>`<div><a data-i="${i}">${esc(s.t||s.u)}</a><button data-del="${i}" title="删除">✕</button></div>`).join('') || '<span class="note">还没有保存的视频。</span>'}</div>
      <p class="note">Echo360 的视频只能在它自己的网站看，点上面的按钮打开。如果这里播放不了，点播放器里的 Panopto 图标，在新窗口看。</p>
    </div></div>`;
}
function bindMonash(){
  const playUrl = u => { const e = panoptoEmbed(u); if (!e) { toast('这不是 Panopto 视频链接'); return false; }
    $('monFrame').innerHTML = `<iframe src="${e}" allow="autoplay; fullscreen" allowfullscreen></iframe>`; return true; };
  $('monPlay').onclick = () => playUrl($('monUrl').value.trim());
  $('monSave').onclick = () => { const u = $('monUrl').value.trim(); if (!panoptoEmbed(u)) { toast('这不是 Panopto 视频链接'); return; }
    const t = window.prompt('给这个视频起个名字（例如：老师名字 + 课程）', '') || u;
    const s = store.get('eh_monash', []); s.unshift({u, t}); store.set('eh_monash', s.slice(0, 30)); render(); };
  $('monSaved').querySelectorAll('[data-i]').forEach(a => a.onclick = () => { const s = store.get('eh_monash', []); playUrl(s[+a.dataset.i].u); });
  $('monSaved').querySelectorAll('[data-del]').forEach(b => b.onclick = () => { const s = store.get('eh_monash', []); s.splice(+b.dataset.del, 1); store.set('eh_monash', s); render(); });
}

/* ---------- Main view ---------- */
let catIdx = store.get('eh_cat_' + TODAY, 0);
function render(){
  $('cats').innerHTML = CATS.map((c,i) => `<button class="cat ${i===catIdx?'on':''}" data-i="${i}">${esc(c.n)}</button>`).join('');
  $('cats').querySelectorAll('.cat').forEach(b => b.onclick = () => { catIdx = +b.dataset.i; store.set('eh_cat_' + TODAY, catIdx); player = null; render(); });
  const cat = CATS[catIdx];
  if (cat.monash) { $('main').innerHTML = monashView(); bindMonash(); return; }
  const key = 'eh_ch_' + cat.k + '_' + TODAY;
  let cur = store.get(key, DAY % cat.list.length);
  if (cur >= cat.list.length) cur = 0;
  const ch = cat.list[cur];
  $('main').innerHTML = `
    <div class="chips">${cat.list.map((c,i) => `<button class="chip ${i===cur?'on':''}" data-i="${i}">${esc(c.n)}</button>`).join('')}</div>
    <div class="player">
      <div class="frame"><div id="yt"></div></div>
      <div class="side">
        <h3>${esc(ch.n)}</h3>
        <div><span class="pill">真人</span><span class="pill">口音：${esc(ch.acc)}</span><span class="pill">最新视频</span></div>
        <p style="margin:0">${esc(ch.zh)}</p>
        <div class="how"><b>怎么学：</b><ol>${cat.how.map(h => `<li>${esc(h)}</li>`).join('')}</ol></div>
        <div class="gembox"><b>用 Gemini 帮忙</b>（先播放视频）<div class="row">${GEM.map((g,i) => `<button class="btn gem" data-g="${i}">${esc(g.n)}</button>`).join('')}</div></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" id="openYT">在 YouTube 打开这个视频 ↗</button><a class="btn ghost" href="${chURL(ch.id)}" target="_blank" rel="noopener">看这个频道 ↗</a></div>
        <p class="note" style="margin:0">播放器里有广告？点上面的按钮，在 YouTube 网站看，会员无广告。</p>
      </div>
    </div>`;
  $('main').querySelectorAll('.chip').forEach(b => b.onclick = () => { store.set(key, +b.dataset.i); player = null; render(); });
  $('main').querySelectorAll('[data-g]').forEach(b => b.onclick = () => askGemini(+b.dataset.g));
  $('openYT').onclick = () => {
    const v = currentVideo();
    if (v) { try { player.pauseVideo(); } catch(e){} window.open(v.u, '_blank', 'noopener'); }
    else window.open('https://www.youtube.com/playlist?list=' + uploads(ch.id), '_blank', 'noopener');
  };
  player = null; play(ch);
}

$('links').innerHTML = LINKS.map(l => `<a class="lk" href="${l.u}" target="_blank" rel="noopener"><b>${esc(l.t)}</b><span>${esc(l.s)}</span></a>`).join('');

/* ---------- Streak ---------- */
function renderStreak(){
  const days = store.get('eh_days', {}); let n = 0; const d = new Date(now);
  if (!days[ymd(d)]) d.setDate(d.getDate()-1);
  while (days[ymd(d)]) { n++; d.setDate(d.getDate()-1); }
  $('streak').textContent = n;
  const w = []; for (let i = 6; i >= 0; i--) { const x = new Date(now); x.setDate(x.getDate()-i); w.push(`<i class="${days[ymd(x)]?'on':''}" title="${ymd(x)}"></i>`); }
  $('dots').innerHTML = w.join('');
  const b = $('donebtn'); const done = !!days[TODAY];
  b.textContent = done ? '今天已完成 ✓' : '今天学完了 ✓'; b.className = done ? 'btn ok' : 'btn light';
}
$('donebtn').onclick = () => { const days = store.get('eh_days', {}); days[TODAY] = !days[TODAY]; store.set('eh_days', days); renderStreak(); };

render(); renderStreak();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
